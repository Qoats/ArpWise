[package]
name = "arpwise"
version = "0.5.0"
edition = "2024"
description = "Fast, driver-free local network scanner with a clean GUI: devices, vendors, latency, history, Wake-on-LAN."
license = "GPL-3.0-only"
authors = ["Qoats"]
readme = "README.md"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.4.0"
dirs = "7.0.0"
dns-lookup = "4.0.2"
eframe = "0.37.0"
egui_extras = "0.37.0"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Networking_WinSock"] }

[lib]
name = "arpwise"
path = "rust/lib.rs"

[[bin]]
name = "arpwise"
path = "rust/bin/cli.rs"

[[bin]]
name = "arpwise-gui"
path = "rust/bin/gui.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

# ---- Linux packages (cargo-deb / cargo-generate-rpm) ----

[package.metadata.deb]
name = "arpwise"
maintainer = "Qoats <support@axim.ch>"
copyright = "Qoats"
license-file = ["LICENSE", "0"]
extended-description = """\
ArpWise finds every device on your local network and shows its address, \
manufacturer, type and latency. It remembers what it has seen, flags new \
devices and can wake machines with Wake-on-LAN. Graphical app and command line."""
section = "net"
priority = "optional"
depends = "libc6"
recommends = "libgl1, libxkbcommon0, libx11-6, libwayland-client0, xdg-desktop-portal"
assets = [
    ["target/release/arpwise", "usr/bin/", "755"],
    ["target/release/arpwise-gui", "usr/bin/", "755"],
    ["packaging/arpwise.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/arpwise.png", "644"],
    ["README.md", "usr/share/doc/arpwise/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "arpwise"
license = "GPL-3.0-only"
url = "https://github.com/Qoats/ArpWise"
auto-req = "no"
assets = [
    { source = "target/release/arpwise", dest = "/usr/bin/arpwise", mode = "755" },
    { source = "target/release/arpwise-gui", dest = "/usr/bin/arpwise-gui", mode = "755" },
    { source = "packaging/arpwise.desktop", dest = "/usr/share/applications/arpwise.desktop", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/arpwise.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/arpwise/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/arpwise/README.md", mode = "644", doc = true },
]
