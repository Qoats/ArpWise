[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netscanpy"
version = "0.1.0"
description = "Simple open-source local network scanner written in Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "evergreen-stack" }
]
dependencies = [
  "scapy>=2.6.1",
  "psutil>=6.0.0",
  "rich>=13.9.0"
]

[project.scripts]
netscanpy = "netscanpy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netscanpy"]
