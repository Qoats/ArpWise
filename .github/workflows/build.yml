name: Build and package

# Run it by hand from the Actions tab to check that everything builds, or push a
# tag such as v0.5.2 (it must match the version in Cargo.toml) to build
# everything, publish a GitHub release, refresh the Scoop and winget manifests
# and publish to npm and crates.io when their tokens are configured.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: x64,   target: x86_64-pc-windows-msvc,  wix_arch: x64,   npm_arch: x64 }
          - { label: x86,   target: i686-pc-windows-msvc,    wix_arch: x86,   npm_arch: ia32 }
          - { label: arm64, target: aarch64-pc-windows-msvc, wix_arch: arm64, npm_arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Package (zip)
        shell: pwsh
        run: |
          $dir = "ArpWise-${{ steps.v.outputs.version }}-windows-${{ matrix.label }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          $bin = "target/${{ matrix.target }}/release"
          Copy-Item "$bin/arpwise.exe", "$bin/arpwise-gui.exe", "LICENSE", "README.md" $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      # Plain archive used by the npm package (Node platform and arch names).
      - name: Package (tar.gz for npm)
        shell: bash
        run: |
          tar -czf "arpwise-${{ steps.v.outputs.version }}-win32-${{ matrix.npm_arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" arpwise.exe arpwise-gui.exe

      - name: Package (MSI)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix build `
            -arch ${{ matrix.wix_arch }} `
            -d Version=${{ steps.v.outputs.version }} `
            -d "BinDir=target\${{ matrix.target }}\release" `
            -o "ArpWise-${{ steps.v.outputs.version }}-windows-${{ matrix.label }}.msi" `
            packaging\windows\arpwise.wxs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.label }}
          path: |
            ArpWise-*.zip
            ArpWise-*.msi
            arpwise-*.tar.gz

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Linux ${{ matrix.label }} (deb + rpm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: x64,   target: x86_64-unknown-linux-gnu,  npm_arch: x64 }
          - { label: x86,   target: i686-unknown-linux-gnu,    npm_arch: ia32 }
          - { label: arm64, target: aarch64-unknown-linux-gnu, npm_arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Zig is used as the cross linker; glibc 2.17 keeps the binaries
      # compatible with old distributions.
      - name: Install Zig
        run: python3 -m pip install --user ziglang

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17

      - name: Package (deb)
        run: |
          mkdir -p dist
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/

      - name: Package (rpm)
        run: cargo generate-rpm --target ${{ matrix.target }} --output dist/

      # Plain archive used by the npm package (Node platform and arch names).
      - name: Package (tar.gz for npm)
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tar -czf "dist/arpwise-${VERSION}-linux-${{ matrix.npm_arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" arpwise arpwise-gui
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.label }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  # ---------------------------------------------------------------- Release --
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version in Cargo.toml
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # --------------------------------------------- Scoop and winget manifests --
  manifests:
    name: Scoop and winget manifests
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate the manifests from the published checksums
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt" -o SHA256SUMS.txt
          python3 packaging/update_manifests.py "${{ github.ref_name }}" SHA256SUMS.txt
          rm SHA256SUMS.txt

      - name: Commit the manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging/winget
          if git diff --cached --quiet; then
            echo "Manifests already up to date."
          else
            git commit -m "Update Scoop and winget manifests for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

  # ------------------------------------------------------------------- npm --
  # Needs the NPM_TOKEN secret (Settings > Secrets and variables > Actions).
  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set: skipping the npm publication."
            exit 0
          fi
          cd npm
          cp ../LICENSE .
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public

  # ------------------------------------------------------------- crates.io --
  # Needs the CARGO_REGISTRY_TOKEN secret.
  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set: skipping the crates.io publication."
            exit 0
          fi
          cargo publish --locked
